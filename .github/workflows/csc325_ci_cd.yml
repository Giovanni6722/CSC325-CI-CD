name: CSC325 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show versions
        run: |
          python --version
          pip --version

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed packages
        run: |
          pip check
          pip list

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run test suite
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo
          echo "Deploy requested for commit $GITHUB_SHA"

      - name: Wait for Render to serve this commit
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::RENDER_APP_URL variable is not set"
            exit 1
          fi
          for i in $(seq 1 60); do
            live=$(curl -fsS "$APP_URL/api/health/" | python -c "import sys, json; print(json.load(sys.stdin).get('commit', ''))" 2>/dev/null || true)
            echo "Attempt $i: live commit = ${live:-unreachable}"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Deployed $GITHUB_SHA to $APP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Render did not serve commit $GITHUB_SHA within 15 minutes"
          exit 1